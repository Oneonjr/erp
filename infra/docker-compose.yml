services:
  # ==========================================
  # BANCO DE DADOS ÚNICO (MariaDB)
  # ==========================================
  mariadb:
    image: mariadb:10.11
    container_name: erp-mariadb
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # ==========================================
  # 1. AKAUNTING (Gestão Financeira e ERP)
  # ==========================================
  akaunting:
    image: akaunting/akaunting:latest
    container_name: akaunting-app
    ports:
      - "8080:80"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=akaunting
      - DB_USERNAME=akaunting_user
      - DB_PASSWORD=akaunting_password
      - AKAUNTING_SETUP=false
    depends_on:
      - mariadb
    volumes:
      - ../akaunting:/var/www/html  <-- Manter comentado por enquanto
      - akaunting_data:/var/www/html/storage
    restart: unless-stopped

  # ==========================================
  # 2. SNIPE-IT (Gestão de Ativos e Logística)
  # ==========================================
  snipeit-redis:
    image: redis:alpine
    container_name: snipeit-redis
    restart: unless-stopped

  snipeit:
    image: snipe/snipe-it:latest
    container_name: snipeit-app
    ports:
      - "8081:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      - APP_URL=http://localhost:8081
      - APP_TIMEZONE=America/Sao_Paulo
      - APP_LOCALE=pt-BR
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=snipeit
      - DB_USERNAME=snipeit_user
      - DB_PASSWORD=snipeit_password
      - REDIS_HOST=snipeit-redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_DRIVER=redis
    depends_on:
      - mariadb
      - snipeit-redis
    volumes:
      - ../snipeit:/var/www/html  <-- Manter comentado por enquanto
      - snipeit_data:/var/lib/snipeit
    restart: unless-stopped
  # ==========================================
  # 3. FIREFLY III (Finanças Pessoais)
  # ==========================================
  firefly-app:
    image: fireflyiii/core:latest
    container_name: firefly-app
    ports:
      - "8082:8080"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly_user
      - DB_PASSWORD=firefly_password
      - APP_KEY=base64:oH9Z/8oD3o3g3A0y1m2b+3/U8T2v9r4k5t9d6h0Y2g4=
      - APP_URL=http://localhost:8082
      - SITE_OWNER=user@example.com
      - TZ=America/Sao_Paulo
    depends_on:
      - mariadb
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    restart: unless-stopped

  # ==========================================
  # 4. INVOICE NINJA (Faturamento)
  # ==========================================
  invoiceninja-app:
    image: invoiceninja/invoiceninja:5
    container_name: invoiceninja-app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8083
      - APP_KEY=base64:q2r3y4t5u6i7o8p9a0s1d2f3g4h5j6k7l8z9x0c1v2b=
      - DB_TYPE=mysql
      - DB_STRICT=false
      - DB_HOST=mariadb
      - DB_DATABASE=invoiceninja
      - DB_USERNAME=invoiceninja_user
      - DB_PASSWORD=invoiceninja_password
      - REQUIRE_HTTPS=false
    depends_on:
      - mariadb
    volumes:
      - invoiceninja_public:/var/app/public
      - invoiceninja_storage:/var/app/storage
    restart: unless-stopped

  invoiceninja-web:
    image: nginx:alpine
    container_name: invoiceninja-web
    ports:
      - "8083:80"
    volumes:
      - ./invoiceninja-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - invoiceninja_public:/var/app/public
    depends_on:
      - invoiceninja-app
    restart: unless-stopped

volumes:
  mariadb_data:
  akaunting_data:
  snipeit_data:
  firefly_upload:
  invoiceninja_public:
  invoiceninja_storage: